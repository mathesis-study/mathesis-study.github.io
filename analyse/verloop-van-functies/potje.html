var asyPotje=(function () {
  var r0=3.27, h0=8.93050209532841, rMin=2, rMax=6.5, inhoud=300;
  function maat(t) {
    var r=rMin+t*(rMax-rMin);
    return {s: r/r0, h: inhoud/(Math.PI*r*r)};
  }
  return {
    // Het potje: de straal schaalt met r, de hoogte met h.
    pot: function (x, t) {
      var m=maat(t);
      return [x[0]*m.s, x[1]*m.s, x[2]*m.h/h0];
    },
    // Het dekseltje: even ruim als het potje, en altijd even hoog erboven.
    deksel: function (x, t) {
      var m=maat(t);
      return [x[0]*m.s, x[1]*m.s, x[2]-h0+m.h];
    }
  };
})();

(function () {
  var rMin=2, stap=0.01, n=Math.round((6.5-rMin)/stap)+1, index=Math.round((3.27-rMin)/stap);
  var waarden=[];
  for(var i=0; i < n; ++i) waarden.push((Math.round((rMin+i*stap)*100)/100).toFixed(2)+' cm');
  function toon() {
    if(typeof asySetTime === 'function') asySetTime(index/(n-1));
  }
  function meld() {
    parent.postMessage({type:'asy-schuif',naam:'r',waarden:waarden,index:index},'*');
  }
  addEventListener('message',function (e) {
    var b=e.data;
    if(!b || b.type !== 'asy-zet-schuif' || !Number.isFinite(b.index)) return;
    index=Math.max(0,Math.min(n-1,Math.round(b.index)));
    toon();
  });
  addEventListener('load',function () { toon(); meld(); });
})();
